<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Audio-Video Processing App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 20px;
      }

      .video-container {
        position: relative;
        width: 640px;
        height: 480px;
        margin: 0 auto;
      }

      #videoFeed {
        width: 640px;
        height: 480px;
        position: absolute;
        top: 0;
        left: 0;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 640px;
        height: 480px;
        background: transparent;
      }

      #response {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <h1>AI Audio-Video Processing</h1>
    <div class="video-container">
      <video id="videoFeed" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
    <p id="response">Speak or show objects to the camera...</p>
    <script>
      const video = document.getElementById("videoFeed");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const responseText = document.getElementById("response");
      let stream;

      async function startVideo() {
        console.log("Starting video...");
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
          console.log("Stream acquired:", stream);
          video.srcObject = stream;
          canvas.width = 640;
          canvas.height = 480;
          responseText.textContent = "Video stream started";
          sendVideoFrames();
          startAudio();
        } catch (err) {
          console.error("Error accessing media devices:", err);
          responseText.textContent = `Error: ${err.message}`;
        }
      }

      function sendVideoFrames() {
        if (!stream) {
          console.error("No stream available");
          responseText.textContent = "No video stream";
          return;
        }
        setInterval(async () => {
          try {
            console.log("Capturing frame via canvas...");
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas
              .getContext("2d")
              .drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            const dataUrl = tempCanvas.toDataURL("image/jpeg");
            const response = await fetch(
              "http://192.168.1.18:5000/detect_objects",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image: dataUrl }),
              }
            );
            const result = await response.json();
            console.log("Server response:", result);
            drawBoundingBoxes(result.objects);
          } catch (err) {
            console.error("Error in frame processing:", err);
            responseText.textContent = `Frame error: ${err.message}`;
          }
        }, 1000 / 5); // 5 FPS
      }

      function drawBoundingBoxes(objects) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        objects.forEach((obj) => {
          ctx.strokeStyle = "red";
          ctx.lineWidth = 2;
          ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
          ctx.fillStyle = "red";
          ctx.font = "16px Arial";
          ctx.fillText(obj.label, obj.x, obj.y - 5);
        });
      }

      async function startAudio() {
        console.log("Starting audio...");
        try {
          const audioStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          const recorder = new MediaRecorder(audioStream, {
            mimeType: "audio/webm; codecs=opus",
          });
          recorder.ondataavailable = async (event) => {
            if (event.data.size > 0) {
              console.log("Audio blob size:", event.data.size);
              const audioBlob = new Blob([event.data], { type: "audio/webm" });
              const reader = new FileReader();
              reader.readAsDataURL(audioBlob);
              reader.onloadend = async () => {
                const base64String = reader.result.split(",")[1];
                try {
                  const response = await fetch(
                    "http://192.168.1.18:5000/transcribe_audio",
                    {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ audio: base64String }),
                    }
                  );
                  const result = await response.json();
                  if (result.reply) {
                    responseText.textContent = result.reply;
                    speak(result.reply);
                  }
                } catch (err) {
                  console.error("Error sending audio:", err);
                  responseText.textContent = `Audio error: ${err.message}`;
                }
              };
            }
          };
          recorder.start(2000); // 2-second chunks for better header integrity
          responseText.textContent = "Audio recording started";
        } catch (err) {
          console.error("Error accessing audio:", err);
          responseText.textContent = `Audio error: ${err.message}`;
        }
      }

      function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      }

      startVideo();
    </script>
  </body>
</html>
